version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devtrack_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: devtrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devtrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devtrack_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:12345@postgres:5432/devtrack_db
      - JWT_SECRET=devtrack_super_secret_jwt_key_change_in_production_32bytes
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devtrack_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
